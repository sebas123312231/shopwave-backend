spring.datasource.url=jdbc:h2:mem:shopwave_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false
shopwave.jwt.secret=unit-test-secret-that-is-at-least-32-characters-long
shopwave.cors.origins=http://localhost:3000
shopwave.seed.enabled=false
shopwave.demo-admin.enabled=false
