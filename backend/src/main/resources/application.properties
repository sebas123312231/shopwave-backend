
# ShopWave rework profile. Use a new database; do not point this at the legacy schema.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:shopwave_rework}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
server.error.include-message=never
spring.profiles.default=local
shopwave.jwt.secret=${JWT_SECRET:}
shopwave.cors.origins=${APP_ORIGIN:http://localhost:3000}
shopwave.seed.enabled=${SHOPWAVE_SEED_ENABLED:false}
shopwave.demo-admin.enabled=${SHOPWAVE_DEMO_ADMIN_ENABLED:false}
shopwave.demo-admin.password=${SHOPWAVE_DEMO_ADMIN_PASSWORD:}

