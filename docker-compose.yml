services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:-shopwave_rework}
      MYSQL_USER: ${DB_USER:-shopwave}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "${DB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-shopwave_rework}
      DB_USER: ${DB_USER:-shopwave}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      SPRING_PROFILES_ACTIVE: demo
      SHOPWAVE_SEED_ENABLED: ${SHOPWAVE_SEED_ENABLED:-true}
      SHOPWAVE_DEMO_ADMIN_ENABLED: ${SHOPWAVE_DEMO_ADMIN_ENABLED:-false}
      SHOPWAVE_DEMO_ADMIN_PASSWORD: ${SHOPWAVE_DEMO_ADMIN_PASSWORD:-}
    restart: on-failure:5
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
